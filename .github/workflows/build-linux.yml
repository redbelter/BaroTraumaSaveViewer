# .github/workflows/build-linux.yml
name: Build Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-app:
    name: PyInstaller (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --clean -y reverse-baro.spec

      - name: Compress
        run: |
          cd dist
          tar -czf reverse-baro-linux.tar.gz reverse-baro/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reverse-baro-linux
          path: dist/reverse-baro-linux.tar.gz
          retention-days: 90

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/reverse-baro-linux.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
