# .github/workflows/build-windows.yml
name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-exe:
    name: PyInstaller (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --clean -y reverse-baro.spec

      - name: Compress distribution
        run: |
          cd dist
          Compress-Archive -Path reverse-baro\* -DestinationPath reverse-baro-win.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reverse-baro-win
          path: dist/reverse-baro-win.zip
          retention-days: 90

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/reverse-baro-win.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
